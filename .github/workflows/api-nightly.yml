name: Deploy API (Nightly)

on:
  push:
    branches: [main]
    paths:
      - apps/api/**
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - .github/workflows/api-nightly.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-api-nightly
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The environment holds the API token. Without it the job would silently use
    # the repo-level CLOUDFLARE_API_TOKEN that deploys the website.
    environment: api-nightly
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: voidzero-dev/setup-vp@3754dd7dbdb32bd8f6d28b6043de13ad3a75f21f # v1.21.1
        with:
          node-version-file: package.json
          run-install: |
            args: ["--filter", "@voice/api..."]
      - name: Record D1 Time Travel bookmark
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: vp exec wrangler d1 time-travel info DB --env nightly
      - name: Apply migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: vp exec wrangler d1 migrations apply DB --env nightly --remote
      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: vp exec wrangler deploy --env nightly --strict
      - name: Check health
        run: curl --fail --silent --show-error --retry 20 --retry-delay 15 --retry-all-errors https://api-nightly.voice.codlume.com/health
