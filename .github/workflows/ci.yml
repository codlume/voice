name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - chore/ci-statechart-smokes

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  js:
    name: JS
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          node-version-file: package.json
          cache: true
          # A pull request's cache could be restored only by that same PR, so only main saves.
          cache-save: ${{ github.event_name == 'push' }}
          run-install: true

      - name: Format
        run: vp run fmt:check

      - name: Lint
        run: vp run lint

      - name: Typecheck
        run: vp run typecheck

      - name: Test
        run: vp run test

      - name: Check generated API schema
        run: vp run --filter @voice/api check:schema

      - name: Test scripts
        run: node --test scripts/release-*.test.mjs scripts/dev-bundle.test.mjs scripts/pr-name-check.test.mjs scripts/workflow-needs.test.mjs scripts/voice-app.test.mjs scripts/main-bench.test.mjs scripts/smoke-resources.test.mjs scripts/renderer-import-boundary.test.mjs scripts/renderer-bench.test.mjs .claude/skills/verify/scripts/*.test.mjs native/voice-helper/scripts/helper.test.mjs native/voice-helper/scripts/bench.test.mjs

      - name: Check statecharts
        run: node .claude/skills/verify/scripts/statecharts.mjs

      - name: Build desktop
        run: vp run build

  swift:
    name: Swift
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Locate Swift toolchain
        id: swift
        run: echo "version=$(swift --version 2>&1 | shasum -a 256 | cut -c1-16)" >> "${GITHUB_OUTPUT}"

      - name: Restore helper build cache
        id: swift-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: native/voice-helper/.build
          # Checkout gives every source a fresh mtime, so SwiftPM recompiles the helper on any hit.
          # Keying on sources would only add entries. The dependency build is what this saves.
          key: swiftpm-${{ steps.swift.outputs.version }}-${{ hashFiles('native/voice-helper/Package.resolved') }}

      - name: Build helper
        run: swift build --package-path native/voice-helper

      - name: Test helper
        run: swift test --package-path native/voice-helper

      - name: Save helper build cache
        if: github.event_name == 'push' && steps.swift-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: native/voice-helper/.build
          key: ${{ steps.swift-cache.outputs.cache-primary-key }}

  smokes:
    name: Smokes
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          node-version-file: package.json
          cache: true
          cache-save: false
          run-install: true

      - name: Locate Swift toolchain
        id: swift
        run: echo "version=$(swift --version 2>&1 | shasum -a 256 | cut -c1-16)" >> "${GITHUB_OUTPUT}"

      # The Swift job saves this cache.
      - name: Restore helper build cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: native/voice-helper/.build
          key: swiftpm-${{ steps.swift.outputs.version }}-${{ hashFiles('native/voice-helper/Package.resolved') }}

      - name: Build helper
        run: swift build --package-path native/voice-helper

      - name: Install Electron
        run: vp exec --filter @voice/desktop install-electron

      # Fixtures regenerate whenever scripts/fixtures.mjs changes, which matches its own stamp.
      - name: Restore fixtures
        id: fixtures
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: test-fixtures/audio
          key: fixtures-${{ hashFiles('scripts/fixtures.mjs') }}

      - name: Generate fixtures
        if: steps.fixtures.outputs.cache-hit != 'true'
        run: |
          brew install ffmpeg
          node scripts/fixtures.mjs

      - name: Save fixtures
        if: github.event_name == 'push' && steps.fixtures.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: test-fixtures/audio
          key: ${{ steps.fixtures.outputs.cache-primary-key }}

      # The manifest pins every model's revision and SHA-256, so it keys the download.
      - name: Restore test models
        id: models
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/test-models
          key: test-models-${{ hashFiles('native/voice-helper/Sources/VoiceHelperCore/ModelManifest.swift') }}

      - name: Point the helper at the test models
        run: echo "VOICE_TEST_MODELS_DIR=${RUNNER_TEMP}/test-models" >> "${GITHUB_ENV}"

      - name: Download test models
        if: steps.models.outputs.cache-hit != 'true'
        run: >-
          node --input-type=module -e 'import { prepareAsr, withHelper } from "./native/voice-helper/scripts/helper.mjs";
          await withHelper({ trace: false }, (helper) => prepareAsr(helper, { download: true }));'

      - name: Save test models
        if: github.event_name == 'push' && steps.models.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/test-models
          key: ${{ steps.models.outputs.cache-primary-key }}

      # Each smoke runs even after another fails, so a PR sees every smoke it broke.
      - name: Transcribe fixtures
        if: ${{ !cancelled() }}
        timeout-minutes: 5
        run: node native/voice-helper/scripts/smoke.mjs

      - name: Cancel and stream long dictation
        if: ${{ !cancelled() }}
        timeout-minutes: 5
        run: node native/voice-helper/scripts/streaming-smoke.mjs

      - name: Microphone test
        if: ${{ !cancelled() }}
        timeout-minutes: 5
        run: node native/voice-helper/scripts/microphone-test-smoke.mjs

      - name: Language
        if: ${{ !cancelled() }}
        timeout-minutes: 5
        run: node native/voice-helper/scripts/language-smoke.mjs

      - name: Hotkey, hold
        if: ${{ !cancelled() }}
        timeout-minutes: 5
        run: node native/voice-helper/scripts/hotkey-smoke.mjs fn hold

      - name: Hotkey, toggle
        if: ${{ !cancelled() }}
        timeout-minutes: 5
        run: node native/voice-helper/scripts/hotkey-smoke.mjs fn toggle

      - name: Insert when the window title ticks
        if: ${{ !cancelled() }}
        timeout-minutes: 5
        run: node native/voice-helper/scripts/title-tick-smoke.mjs

      - name: Refuse an insert after page navigation
        if: ${{ !cancelled() }}
        timeout-minutes: 5
        run: node native/voice-helper/scripts/page-navigation-smoke.mjs
