name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Check
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@3754dd7dbdb32bd8f6d28b6043de13ad3a75f21f # v1.21.1
        with:
          node-version-file: package.json
          cache: true
          # A pull request's cache could be restored only by that same PR, so only main saves.
          cache-save: ${{ github.event_name == 'push' }}
          run-install: true

      - name: Locate Swift toolchain
        id: swift
        run: echo "version=$(swift --version 2>&1 | shasum -a 256 | cut -c1-16)" >> "${GITHUB_OUTPUT}"

      - name: Format
        run: vp run fmt:check

      - name: Lint
        run: vp run lint

      - name: Typecheck
        run: vp run typecheck

      - name: Test
        run: vp run test

      - name: Check generated API schema
        run: vp run --filter @voice/api check:schema

      - name: Test scripts
        run: node --test scripts/release-*.test.mjs scripts/dev-bundle.test.mjs

      - name: Build desktop
        run: vp run build

      - name: Restore helper build cache
        id: swift-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: native/voice-helper/.build
          # Checkout gives every source a fresh mtime, so SwiftPM recompiles the helper on any hit.
          # Keying on sources would only add entries. The dependency build is what this saves.
          key: swiftpm-${{ steps.swift.outputs.version }}-${{ hashFiles('native/voice-helper/Package.resolved') }}

      - name: Build helper
        run: swift build --package-path native/voice-helper

      - name: Test helper
        run: swift test --package-path native/voice-helper

      - name: Save helper build cache
        if: github.event_name == 'push' && steps.swift-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: native/voice-helper/.build
          key: ${{ steps.swift-cache.outputs.cache-primary-key }}
