name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  check:
    name: Check
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: voidzero-dev/setup-vp@3754dd7dbdb32bd8f6d28b6043de13ad3a75f21f # v1.21.1
        with:
          version: 0.3.0
          node-version: 24.21.0
          run-install: false
          # The accepted action omits the package-manager version from its cache key.
          # Cache the pnpm store explicitly with all required separation below.
          cache: false
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 11.10.0
          run_install: false
      - name: Locate pinned pnpm store
        id: store
        shell: bash
        run: |
          test "$(pnpm --version)" = 11.10.0
          echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ steps.store.outputs.path }}
          key: pnpm-${{ runner.os }}-${{ runner.arch }}-11.10.0-${{ hashFiles('pnpm-lock.yaml') }}
      - run: pnpm install --frozen-lockfile
      - run: pnpm fmt:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test:toolchain
      - name: Retain synthetic test diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: check-diagnostics
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
  test:
    name: Test
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: voidzero-dev/setup-vp@3754dd7dbdb32bd8f6d28b6043de13ad3a75f21f # v1.21.1
        with:
          version: 0.3.0
          node-version: 24.21.0
          run-install: false
          # The accepted action omits the package-manager version from its cache key.
          # Cache the pnpm store explicitly with all required separation below.
          cache: false
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 11.10.0
          run_install: false
      - name: Locate pinned pnpm store
        id: store
        shell: bash
        run: |
          test "$(pnpm --version)" = 11.10.0
          echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ steps.store.outputs.path }}
          key: pnpm-${{ runner.os }}-${{ runner.arch }}-11.10.0-${{ hashFiles('pnpm-lock.yaml') }}
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm test:acceptance
      - run: pnpm build:renderer
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:renderer
      - run: pnpm test:hmr
      - name: Retain synthetic test diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: test-diagnostics
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
  desktop:
    name: macOS Desktop
    runs-on: macos-26
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: voidzero-dev/setup-vp@3754dd7dbdb32bd8f6d28b6043de13ad3a75f21f # v1.21.1
        with:
          version: 0.3.0
          node-version: 24.21.0
          run-install: false
          # The accepted action omits the package-manager version from its cache key.
          # Cache the pnpm store explicitly with all required separation below.
          cache: false
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 11.10.0
          run_install: false
      - name: Locate pinned pnpm store
        id: store
        shell: bash
        run: |
          test "$(pnpm --version)" = 11.10.0
          echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ steps.store.outputs.path }}
          key: pnpm-${{ runner.os }}-${{ runner.arch }}-11.10.0-${{ hashFiles('pnpm-lock.yaml') }}
      - run: pnpm install --frozen-lockfile
      - run: test "$(uname -m)" = arm64
      - run: pnpm test:native
      - run: pnpm build:desktop
      - run: pnpm package:desktop
      - run: pnpm test:desktop-smoke
      - run: pnpm test:dev
      - name: Retain synthetic test diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: desktop-diagnostics
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
