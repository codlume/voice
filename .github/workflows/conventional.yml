# Copied from hadrysm/fleet's reusable conventional.yml. An org repo can't call
# that private workflow, so this copy runs on pull_request with its inputs inlined.
# The title and branch rules live in scripts/pr-name-check.sh, where a test pins
# the names bots such as release-please give their PRs.
name: conventional

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
permissions:
  contents: read

jobs:
  conventional:
    name: conventional
    if: github.event.pull_request
    runs-on: ubuntu-latest
    steps:
      # The default ref is the PR merged into its base, so a branch opened before a change
      # to the name check still runs the current one.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: PR title and branch are semantic
        env:
          TITLE: ${{ github.event.pull_request.title }}
          BRANCH: ${{ github.head_ref }}
        run: bash scripts/pr-name-check.sh

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Commits are conventional
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          TYPES: feat|fix|chore|refactor|docs|test|perf|build|ci|style|revert
          V: "19"
        run: |
          dir="$RUNNER_TEMP/commitlint"
          mkdir -p "$dir"
          npm install --prefix "$dir" --no-save --no-audit --no-fund \
            "@commitlint/cli@$V" "@commitlint/config-conventional@$V" >/dev/null
          types_json=$(tr '|' '\n' <<<"$TYPES" | sed 's/.*/"&"/' | paste -sd, -)
          cat > "$dir/commitlint.config.mjs" <<CFG
          export default {
            extends: ["@commitlint/config-conventional"],
            rules: {
              "type-enum": [2, "always", [${types_json}]],
              "body-max-line-length": [0],
              "footer-max-line-length": [0],
            },
          };
          CFG
          base=$(git merge-base "$BASE_SHA" "$HEAD_SHA")
          "$dir/node_modules/.bin/commitlint" --config "$dir/commitlint.config.mjs" \
            --cwd "$GITHUB_WORKSPACE" --from "$base" --to "$HEAD_SHA" --verbose
