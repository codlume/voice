name: Release

on:
  push:
    branches: [main]
  schedule:
    # Nightlies are throttled to one per slot, like T3 Code; minute 17 avoids the busy top of the hour.
    - cron: "17 */6 * * *"
  workflow_dispatch:
    inputs:
      stable_tag:
        description: Rebuild an existing stable release, for example v0.20.1. Leave empty for a Nightly.
        required: false
        default: ""

# Only jobs that run no dependency code get write access. A write token can push to main,
# and the next Nightly would sign and ship that commit.
permissions:
  contents: read

jobs:
  release-please:
    if: github.ref == 'refs/heads/main' && github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    # A group holds one running and one pending job, and a newly queued job cancels the pending
    # one. A rebuild skips release-please, so each tag gets its own group and back-to-back rebuilds
    # of different tags all run.
    concurrency:
      group: ${{ inputs.stable_tag && format('release-rebuild-{0}', inputs.stable_tag) || 'release-please-main' }}
      cancel-in-progress: false
    outputs:
      stable: ${{ steps.detect.outputs.stable }}
      stable_version: ${{ steps.detect.outputs.stable_version }}
      stable_sha: ${{ steps.detect.outputs.stable_sha }}
      stable_api_changed: ${{ steps.api.outputs.changed }}
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        if: inputs.stable_tag == ''
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Detect stable release
        id: detect
        env:
          GH_TOKEN: ${{ github.token }}
          ACTION_RELEASE_CREATED: ${{ steps.release.outputs.release_created }}
          ACTION_RELEASE_TAG: ${{ steps.release.outputs.tag_name }}
          ACTION_RELEASE_SHA: ${{ steps.release.outputs.sha }}
          STABLE_TAG: ${{ inputs.stable_tag }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "${STABLE_TAG}" ]]; then
            [[ "${STABLE_TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "stable_tag must look like v1.2.3" >&2; exit 1; }
            tag="${STABLE_TAG}"
          elif [[ "${ACTION_RELEASE_CREATED}" == true ]]; then
            tag="${ACTION_RELEASE_TAG}"
          else
            tag="v$(node -p 'require("./package.json").version')"
          fi
          if ! git rev-parse -q --verify "refs/tags/${tag}" >/dev/null; then
            [[ "${ACTION_RELEASE_CREATED}" != true && -z "${STABLE_TAG}" ]] && exit 0
            echo "Tag ${tag} does not exist" >&2
            exit 1
          fi
          sha="$(git rev-list -n 1 "${tag}")"
          if [[ "${ACTION_RELEASE_CREATED}" == true ]]; then
            [[ "${sha}" == "${ACTION_RELEASE_SHA}" ]] || exit 1
          elif [[ -z "${STABLE_TAG}" ]]; then
            [[ "${sha}" == "${GITHUB_SHA}" ]] || exit 0
          fi
          version="$(git show "${tag}:package.json" | node -p 'JSON.parse(require("fs").readFileSync(0, "utf8")).version')"
          desktop_version="$(git show "${tag}:apps/desktop/package.json" | node -p 'JSON.parse(require("fs").readFileSync(0, "utf8")).version')"
          [[ "${version}" == "${desktop_version}" && "${tag}" == "v${version}" ]] || exit 1
          gh release view "${tag}" --json tagName >/dev/null
          {
            echo "stable=true"
            echo "stable_version=${version}"
            echo "stable_sha=${sha}"
          } >> "${GITHUB_OUTPUT}"
      # A rebuild never redeploys the API, because the live API may already be newer than the tag.
      - name: Detect Stable API changes
        id: api
        if: steps.detect.outputs.stable == 'true' && inputs.stable_tag == ''
        env:
          STABLE_SHA: ${{ steps.detect.outputs.stable_sha }}
        shell: bash
        run: |
          set -euo pipefail
          previous="$(git describe --tags --abbrev=0 --match 'v[0-9]*' --exclude 'v*-*' "${STABLE_SHA}^")"
          if ! git diff --quiet "${previous}" "${STABLE_SHA}" -- apps/api; then
            echo "changed=true" >> "${GITHUB_OUTPUT}"
          fi

  stable-api-deploy:
    needs: release-please
    if: needs.release-please.outputs.stable == 'true' && needs.release-please.outputs.stable_api_changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    # The environment holds the API token and the reviewer gate. Without it the job would
    # silently use the repo-level CLOUDFLARE_API_TOKEN that deploys the website.
    environment: api-stable
    concurrency:
      group: deploy-api-stable
      cancel-in-progress: false
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.stable_sha }}
          persist-credentials: false
      - uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          node-version-file: package.json
          run-install: |
            args: ["--filter", "@voice/api..."]
      - name: Record D1 Time Travel bookmark
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: vp exec wrangler d1 time-travel info DB --env stable
      - name: Apply migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: vp exec wrangler d1 migrations apply DB --env stable --remote
      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: vp exec wrangler deploy --env stable --strict
      - name: Check health
        run: curl --fail --silent --show-error --retry 20 --retry-delay 15 --retry-all-errors https://api.voice.codlume.com/health

  nightly-due:
    if: github.ref == 'refs/heads/main' && github.event_name != 'push' && inputs.stable_tag == ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      # Reads CI's result for HEAD.
      actions: read
    outputs:
      due: ${{ steps.due.outputs.due }}
      previous: ${{ steps.due.outputs.previous }}
      version: ${{ steps.due.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: due
        env:
          GH_TOKEN: ${{ github.token }}
          MANUAL: ${{ github.event_name == 'workflow_dispatch' }}
        # Resolve the version once so build and publish agree across midnight UTC.
        run: |
          bash scripts/release-nightly-due.sh >> "${GITHUB_OUTPUT}"
          version="$(node scripts/release-version.mjs nightly)"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"

  # Stable and Nightly ship through the same build, publish, and release jobs. This job picks the
  # channel, version, commit, and notes once. Both never apply, because a Stable commit is never
  # due a Nightly; Stable would win.
  plan:
    needs: [release-please, nightly-due]
    if: >-
      ${{ !cancelled() &&
      ((needs.release-please.result == 'success' && needs.release-please.outputs.stable == 'true') ||
      (needs.nightly-due.result == 'success' && needs.nightly-due.outputs.due == 'true')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      # The generate-notes endpoint requires write access.
      contents: write
    outputs:
      channel: ${{ steps.plan.outputs.channel }}
      version: ${{ steps.plan.outputs.version }}
      sha: ${{ steps.plan.outputs.sha }}
      notes: ${{ steps.plan.outputs.notes }}
    steps:
      - id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          STABLE: ${{ needs.release-please.outputs.stable }}
          STABLE_VERSION: ${{ needs.release-please.outputs.stable_version }}
          STABLE_SHA: ${{ needs.release-please.outputs.stable_sha }}
          NIGHTLY_VERSION: ${{ needs.nightly-due.outputs.version }}
          PREVIOUS_NIGHTLY: ${{ needs.nightly-due.outputs.previous }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${STABLE}" == true ]]; then
            channel=stable version="${STABLE_VERSION}" sha="${STABLE_SHA}"
            notes="$(gh release view "v${version}" --json body --jq .body)"
          else
            channel=nightly version="${NIGHTLY_VERSION}" sha="${GITHUB_SHA}"
            since=()
            if [[ -n "${PREVIOUS_NIGHTLY}" ]]; then since=(-f previous_tag_name="${PREVIOUS_NIGHTLY}"); fi
            notes="$(gh api "repos/${GITHUB_REPOSITORY}/releases/generate-notes" \
              -f tag_name="v${version}" \
              -f target_commitish="${sha}" \
              "${since[@]}" \
              --jq .body)"
          fi
          delimiter="notes_$(openssl rand -hex 16)"
          {
            echo "channel=${channel}"
            echo "version=${version}"
            echo "sha=${sha}"
            printf 'notes<<%s\n%s\n%s\n' "${delimiter}" "${notes}" "${delimiter}"
          } >> "${GITHUB_OUTPUT}"

  build:
    needs: plan
    runs-on: macos-15
    timeout-minutes: 90
    env:
      RELEASE_CHANNEL: ${{ needs.plan.outputs.channel }}
      RELEASE_VERSION: ${{ needs.plan.outputs.version }}
      RELEASE_BASE_URL: ${{ vars.RELEASE_BASE_URL }}
      R2_ACCOUNT_ID: ${{ vars.R2_ACCOUNT_ID }}
      R2_BUCKET: ${{ vars.R2_BUCKET }}
      SENTRY_ORG: ${{ vars.SENTRY_ORG }}
      SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT }}
      VOICE_SENTRY_DSN: ${{ vars.SENTRY_DSN }}
    outputs:
      skip: ${{ steps.preflight.outputs.skip }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.sha }}
          persist-credentials: false
      - uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          node-version-file: package.json
          cache: true
          run-install: true
      - run: aws --version
      # The feed already holds a newer version when an older tag is rebuilt, and the tag's own
      # preflight would skip it. Publish still refuses to move the feed backwards.
      - name: Check published version
        id: preflight
        if: inputs.stable_tag == ''
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: node scripts/release-preflight.mjs
      # stapler reaches Apple over HTTP/3, which GitHub's macOS runners drop; blocking UDP 443
      # forces TCP. https://github.com/actions/runner-images/issues/14924
      - name: Force stapler onto TCP
        if: steps.preflight.outputs.skip != 'true'
        run: |
          echo "block return out quick proto udp from any to any port 443" | sudo pfctl -f -
          sudo pfctl -E
      - name: Import Developer ID certificate
        if: steps.preflight.outputs.skip != 'true'
        env:
          CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: bash scripts/release-keychain.sh
      - name: Build, sign, notarize, and verify
        if: steps.preflight.outputs.skip != 'true'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        run: node scripts/release-build.mjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.preflight.outputs.skip != 'true'
        with:
          name: ${{ needs.plan.outputs.channel }}-mac-arm64
          path: |
            apps/desktop/release/*.dmg
            apps/desktop/release/*.zip
            apps/desktop/release/*.blockmap
            apps/desktop/release/latest-mac.yml
          if-no-files-found: error
          retention-days: 7
      - name: Remove temporary keychain
        if: always()
        run: bash scripts/release-keychain.sh cleanup

  publish:
    needs: [plan, build]
    if: needs.build.outputs.skip != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: release-publish-${{ needs.plan.outputs.channel }}
      cancel-in-progress: false
    env:
      RELEASE_CHANNEL: ${{ needs.plan.outputs.channel }}
      RELEASE_VERSION: ${{ needs.plan.outputs.version }}
      RELEASE_BASE_URL: ${{ vars.RELEASE_BASE_URL }}
      R2_ACCOUNT_ID: ${{ vars.R2_ACCOUNT_ID }}
      R2_BUCKET: ${{ vars.R2_BUCKET }}
    outputs:
      result: ${{ steps.publish.outputs.result }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.sha }}
          persist-credentials: false
      - uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          node-version-file: package.json
          run-install: |
            args: ["--workspace-root"]
      - run: aws --version
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.plan.outputs.channel }}-mac-arm64
          path: apps/desktop/release/
      - id: publish
        env:
          RELEASE_NOTES: ${{ needs.plan.outputs.notes }}
          RELEASE_NOTES_FILE: ${{ runner.temp }}/release-notes.md
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          printf '%s\n' "${RELEASE_NOTES}" > "${RELEASE_NOTES_FILE}"
          result="$(node scripts/release-publish.mjs)"
          echo "${result}"
          echo "result=${result}" >> "${GITHUB_OUTPUT}"

  # A rebuilt older Stable still gets its DMG, though publish leaves the feed alone.
  release:
    needs: [plan, publish]
    if: needs.plan.outputs.channel == 'stable' || needs.publish.outputs.result != 'skipped-older'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    # A separate group, because a job waiting in release-publish-* would cancel a pending publish.
    concurrency:
      group: release-github-${{ needs.plan.outputs.channel }}
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.plan.outputs.channel }}-mac-arm64
          path: release/
      # release-please already created the Stable release; a Nightly creates its prerelease here.
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_VERSION: ${{ needs.plan.outputs.version }}
          RELEASE_SHA: ${{ needs.plan.outputs.sha }}
          RELEASE_NOTES: ${{ needs.plan.outputs.notes }}
        shell: bash
        run: |
          set -euo pipefail
          tag="v${RELEASE_VERSION}"
          if gh release view "${tag}" --json tagName >/dev/null 2>&1; then
            gh release upload "${tag}" release/*.dmg --clobber
          else
            notes="${RUNNER_TEMP}/prerelease-notes.md"
            printf 'Unstable build of %s. Installed Nightlies update themselves.\n\n%s\n' "${RELEASE_SHA}" "${RELEASE_NOTES}" > "${notes}"
            gh release create "${tag}" release/*.dmg \
              --prerelease \
              --target "${RELEASE_SHA}" \
              --title "Voice Nightly ${RELEASE_VERSION} (${RELEASE_SHA::12})" \
              --notes-file "${notes}"
          fi
