name: Release

on:
  push:
    branches: [main]
  schedule:
    # Nightlies are throttled to one per slot, like T3 Code; minute 17 avoids the busy top of the hour.
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    if: github.ref == 'refs/heads/main' && github.event_name != 'schedule'
    runs-on: ubuntu-latest
    concurrency:
      group: release-please-main
      cancel-in-progress: false
    outputs:
      stable: ${{ steps.detect.outputs.stable }}
      stable_version: ${{ steps.detect.outputs.stable_version }}
      stable_sha: ${{ steps.detect.outputs.stable_sha }}
      stable_api_changed: ${{ steps.api.outputs.changed }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Detect stable release
        id: detect
        env:
          GH_TOKEN: ${{ github.token }}
          ACTION_RELEASE_CREATED: ${{ steps.release.outputs.release_created }}
          ACTION_RELEASE_TAG: ${{ steps.release.outputs.tag_name }}
          ACTION_RELEASE_SHA: ${{ steps.release.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${ACTION_RELEASE_CREATED}" == true ]]; then
            tag="${ACTION_RELEASE_TAG}"
          else
            tag="v$(node -p 'require("./package.json").version')"
          fi
          if ! git rev-parse -q --verify "refs/tags/${tag}" >/dev/null; then
            [[ "${ACTION_RELEASE_CREATED}" != true ]] && exit 0
            echo "release-please reported a release without a tag" >&2
            exit 1
          fi
          sha="$(git rev-list -n 1 "${tag}")"
          if [[ "${ACTION_RELEASE_CREATED}" == true ]]; then
            [[ "${sha}" == "${ACTION_RELEASE_SHA}" ]] || exit 1
          else
            [[ "${sha}" == "${GITHUB_SHA}" ]] || exit 0
          fi
          version="$(git show "${tag}:package.json" | node -p 'JSON.parse(require("fs").readFileSync(0, "utf8")).version')"
          desktop_version="$(git show "${tag}:apps/desktop/package.json" | node -p 'JSON.parse(require("fs").readFileSync(0, "utf8")).version')"
          [[ "${version}" == "${desktop_version}" && "${tag}" == "v${version}" ]] || exit 1
          gh release view "${tag}" --json tagName >/dev/null
          {
            echo "stable=true"
            echo "stable_version=${version}"
            echo "stable_sha=${sha}"
          } >> "${GITHUB_OUTPUT}"
      - name: Detect Stable API changes
        id: api
        if: steps.detect.outputs.stable == 'true'
        env:
          STABLE_SHA: ${{ steps.detect.outputs.stable_sha }}
        shell: bash
        run: |
          set -euo pipefail
          previous="$(git describe --tags --abbrev=0 --match 'v[0-9]*' --exclude 'v*-*' "${STABLE_SHA}^")"
          if ! git diff --quiet "${previous}" "${STABLE_SHA}" -- apps/api; then
            echo "changed=true" >> "${GITHUB_OUTPUT}"
          fi

  stable-api-deploy:
    needs: release-please
    if: needs.release-please.outputs.stable == 'true' && needs.release-please.outputs.stable_api_changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    # The environment holds the API token and the reviewer gate. Without it the job would
    # silently use the repo-level CLOUDFLARE_API_TOKEN that deploys the website.
    environment: api-stable
    concurrency:
      group: deploy-api-stable
      cancel-in-progress: false
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.release-please.outputs.stable_sha }}
      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: true
      - name: Record D1 Time Travel bookmark
        run: vp exec wrangler d1 time-travel info DB --env stable
      - name: Apply migrations
        run: vp exec wrangler d1 migrations apply DB --env stable --remote
      - name: Deploy
        run: vp exec wrangler deploy --env stable --strict
      - name: Check health
        run: curl --fail --silent --show-error --retry 20 --retry-delay 15 --retry-all-errors https://api.voice.codlume.com/health

  nightly-due:
    if: github.ref == 'refs/heads/main' && github.event_name != 'push'
    runs-on: ubuntu-latest
    outputs:
      due: ${{ steps.due.outputs.due }}
      previous: ${{ steps.due.outputs.previous }}
      version: ${{ steps.due.outputs.version }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - id: due
        env:
          GH_TOKEN: ${{ github.token }}
          MANUAL: ${{ github.event_name == 'workflow_dispatch' }}
        # Resolve the version once so build and publish agree across midnight UTC.
        run: |
          bash scripts/release-nightly-due.sh >> "${GITHUB_OUTPUT}"
          version="$(node scripts/release-version.mjs nightly)"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"

  nightly-build:
    needs: nightly-due
    if: needs.nightly-due.outputs.due == 'true'
    runs-on: macos-15
    timeout-minutes: 90
    env:
      RELEASE_CHANNEL: nightly
      RELEASE_VERSION: ${{ needs.nightly-due.outputs.version }}
      RELEASE_BASE_URL: ${{ vars.RELEASE_BASE_URL }}
      R2_ACCOUNT_ID: ${{ vars.R2_ACCOUNT_ID }}
      R2_BUCKET: ${{ vars.R2_BUCKET }}
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
      SENTRY_ORG: ${{ vars.SENTRY_ORG }}
      SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT }}
      VOICE_SENTRY_DSN: ${{ vars.SENTRY_DSN }}
    steps:
      - uses: actions/checkout@v6
      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: true
      - name: Install AWS CLI
        run: brew install awscli
      - name: Check published version
        id: preflight
        run: node scripts/release-preflight.mjs
      - name: Import Developer ID certificate
        if: steps.preflight.outputs.skip != 'true'
        env:
          CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: bash scripts/release-keychain.sh
      - name: Build, sign, notarize, and verify
        if: steps.preflight.outputs.skip != 'true'
        run: node scripts/release-build.mjs
      - uses: actions/upload-artifact@v7
        if: steps.preflight.outputs.skip != 'true'
        with:
          name: nightly-mac-arm64
          path: |
            apps/desktop/release/*.dmg
            apps/desktop/release/*.zip
            apps/desktop/release/*.blockmap
            apps/desktop/release/latest-mac.yml
          if-no-files-found: error
          retention-days: 7
      - name: Remove temporary keychain
        if: always()
        run: bash scripts/release-keychain.sh cleanup
    outputs:
      skip: ${{ steps.preflight.outputs.skip }}

  stable-build:
    needs: release-please
    if: needs.release-please.outputs.stable == 'true'
    runs-on: macos-15
    timeout-minutes: 90
    env:
      RELEASE_CHANNEL: stable
      RELEASE_VERSION: ${{ needs.release-please.outputs.stable_version }}
      RELEASE_BASE_URL: ${{ vars.RELEASE_BASE_URL }}
      R2_ACCOUNT_ID: ${{ vars.R2_ACCOUNT_ID }}
      R2_BUCKET: ${{ vars.R2_BUCKET }}
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
      SENTRY_ORG: ${{ vars.SENTRY_ORG }}
      SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT }}
      VOICE_SENTRY_DSN: ${{ vars.SENTRY_DSN }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.release-please.outputs.stable_sha }}
      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: true
      - name: Install AWS CLI
        run: brew install awscli
      - name: Check published version
        id: preflight
        run: node scripts/release-preflight.mjs
      - name: Import Developer ID certificate
        if: steps.preflight.outputs.skip != 'true'
        env:
          CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: bash scripts/release-keychain.sh
      - name: Build, sign, notarize, and verify
        if: steps.preflight.outputs.skip != 'true'
        run: node scripts/release-build.mjs
      - uses: actions/upload-artifact@v7
        if: steps.preflight.outputs.skip != 'true'
        with:
          name: stable-mac-arm64
          path: |
            apps/desktop/release/*.dmg
            apps/desktop/release/*.zip
            apps/desktop/release/*.blockmap
            apps/desktop/release/latest-mac.yml
          if-no-files-found: error
          retention-days: 7
      - name: Remove temporary keychain
        if: always()
        run: bash scripts/release-keychain.sh cleanup
    outputs:
      skip: ${{ steps.preflight.outputs.skip }}

  nightly-publish:
    needs: [nightly-due, nightly-build]
    if: needs.nightly-build.outputs.skip != 'true'
    runs-on: ubuntu-latest
    concurrency:
      group: release-publish-nightly
      cancel-in-progress: false
    env:
      RELEASE_CHANNEL: nightly
      RELEASE_VERSION: ${{ needs.nightly-due.outputs.version }}
      RELEASE_BASE_URL: ${{ vars.RELEASE_BASE_URL }}
      R2_ACCOUNT_ID: ${{ vars.R2_ACCOUNT_ID }}
      R2_BUCKET: ${{ vars.R2_BUCKET }}
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@v6
      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: true
      - run: aws --version
      - uses: actions/download-artifact@v8
        with:
          name: nightly-mac-arm64
          path: apps/desktop/release/
      - name: Generate release notes
        env:
          GH_TOKEN: ${{ github.token }}
          PREVIOUS_NIGHTLY: ${{ needs.nightly-due.outputs.previous }}
        shell: bash
        run: |
          set -euo pipefail
          since=()
          if [[ -n "${PREVIOUS_NIGHTLY}" ]]; then since=(-f previous_tag_name="${PREVIOUS_NIGHTLY}"); fi
          gh api "repos/${GITHUB_REPOSITORY}/releases/generate-notes" \
            -f tag_name="v${RELEASE_VERSION}" \
            -f target_commitish="${GITHUB_SHA}" \
            "${since[@]}" \
            --jq .body > "${RUNNER_TEMP}/release-notes.md"
      - id: publish
        env:
          RELEASE_NOTES_FILE: ${{ runner.temp }}/release-notes.md
        run: |
          result="$(node scripts/release-publish.mjs)"
          echo "${result}"
          echo "result=${result}" >> "${GITHUB_OUTPUT}"
      - name: Publish GitHub prerelease
        if: steps.publish.outputs.result != 'skipped-older'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag="v${RELEASE_VERSION}"
          if gh release view "${tag}" --json tagName >/dev/null 2>&1; then
            gh release upload "${tag}" apps/desktop/release/*.dmg --clobber
          else
            notes="${RUNNER_TEMP}/prerelease-notes.md"
            printf 'Unstable build of %s. Installed Nightlies update themselves.\n\n' "${GITHUB_SHA}" > "${notes}"
            cat "${RUNNER_TEMP}/release-notes.md" >> "${notes}"
            gh release create "${tag}" apps/desktop/release/*.dmg \
              --prerelease \
              --target "${GITHUB_SHA}" \
              --title "Voice Nightly ${RELEASE_VERSION} (${GITHUB_SHA::12})" \
              --notes-file "${notes}"
          fi

  stable-publish:
    needs: [release-please, stable-build]
    if: needs.stable-build.result == 'success' && needs.stable-build.outputs.skip != 'true'
    runs-on: ubuntu-latest
    concurrency:
      group: release-publish-stable
      cancel-in-progress: false
    env:
      RELEASE_CHANNEL: stable
      RELEASE_VERSION: ${{ needs.release-please.outputs.stable_version }}
      RELEASE_BASE_URL: ${{ vars.RELEASE_BASE_URL }}
      R2_ACCOUNT_ID: ${{ vars.R2_ACCOUNT_ID }}
      R2_BUCKET: ${{ vars.R2_BUCKET }}
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.release-please.outputs.stable_sha }}
      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: true
      - run: aws --version
      - uses: actions/download-artifact@v8
        with:
          name: stable-mac-arm64
          path: apps/desktop/release/
      - name: Read release notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release view "v${RELEASE_VERSION}" --json body --jq .body > "${RUNNER_TEMP}/release-notes.md"
      - env:
          RELEASE_NOTES_FILE: ${{ runner.temp }}/release-notes.md
        run: node scripts/release-publish.mjs
      - name: Attach DMG to GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "v${RELEASE_VERSION}" apps/desktop/release/*.dmg --clobber
