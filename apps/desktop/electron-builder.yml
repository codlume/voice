appId: com.voice.app
productName: Voice
# The sign-in callback scheme. VOICE_URL_SCHEME in src/shared/api.ts must match; a test checks it.
protocols:
  - name: Voice
    schemes:
      - com.codlume.voice
directories:
  output: release
files:
  - dist/**
  - dist-electron/**
  - package.json
asarUnpack:
  - node_modules/node-llama-cpp/**
  - node_modules/@node-llama-cpp/**
# node-llama-cpp ships prebuilt N-API binaries, which need no rebuild for Electron.
npmRebuild: false
extraResources:
  - from: ../../native/voice-helper/.build/release/voice-helper
    to: bin/voice-helper
mac:
  target:
    - target: dmg
      arch: arm64
    - target: zip
      arch: arm64
  icon: build/icon.svg
  hardenedRuntime: true
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  notarize: false
  extendInfo:
    NSMicrophoneUsageDescription: Voice records your speech only while you hold the dictation shortcut.
# These positions and iconSize drive build/background*.png. Rerun `pnpm -C apps/desktop brand` after changing them.
dmg:
  title: Voice
  background: build/background.png
  iconSize: 128
  contents:
    - x: 170
      y: 190
      type: file
    - x: 490
      y: 190
      type: link
      path: /Applications
# Development scripts run the stock electron binary, which keeps its default fuses.
electronFuses:
  runAsNode: false
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  enableEmbeddedAsarIntegrityValidation: true
  onlyLoadAppFromAsar: true
afterPack: ../../scripts/release-sign-nested.mjs
generateUpdatesFilesForAllChannels: false
