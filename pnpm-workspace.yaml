  "@types/node": 24.12.4
  "@vitejs/plugin-react": 6.1.2
  react: 19.3.1
  react-dom: 19.3.1
  typescript: 7.0.2
  vite: npm:@voidzero-dev/vite-plus-core@1.4.0
  vite-plus: 1.4.0
  wrangler: 4.156.0
  yaml: 2.9.1

overrides:
